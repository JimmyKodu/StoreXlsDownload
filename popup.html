<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XLS Download Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 XLS 文件管理</h1>
      <div class="header-actions">
        <button id="clearAll" class="btn btn-danger">清空所有</button>
      </div>
    </header>
    
    <div class="stats">
      <span id="fileCount">0</span> 个已拦截的XLS文件
    </div>
    
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="搜索文件名...">
    </div>
    
    <div id="downloadsList" class="downloads-list">
      <!-- Downloads will be populated here -->
    </div>
    
    <div id="emptyState" class="empty-state">
      <p>暂无拦截的XLS文件</p>
      <small>当您下载XLS文件时，它们会自动显示在这里</small>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
